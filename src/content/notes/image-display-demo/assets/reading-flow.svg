<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Markdown 笔记中的本地图片展示示意</title>
  <desc id="desc">展示文章文件夹、assets 图片目录和网站正文之间的关系。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f7f1" />
      <stop offset="1" stop-color="#e6f0e9" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#43836b" />
    </marker>
  </defs>
  <rect width="960" height="420" rx="28" fill="url(#background)" />
  <text x="48" y="58" fill="#18382d" font-family="system-ui, sans-serif" font-size="25" font-weight="700">一篇笔记的图片如何进入页面</text>

  <rect x="48" y="100" width="265" height="258" rx="18" fill="#fff" stroke="#c9d9ce" stroke-width="2" />
  <text x="74" y="139" fill="#23664e" font-family="system-ui, sans-serif" font-size="17" font-weight="700">文章目录</text>
  <rect x="72" y="162" width="217" height="48" rx="9" fill="#f4f7f4" />
  <text x="89" y="192" fill="#24352d" font-family="ui-monospace, monospace" font-size="15">index.md</text>
  <rect x="72" y="224" width="217" height="112" rx="9" fill="#f4f7f4" />
  <text x="89" y="254" fill="#24352d" font-family="ui-monospace, monospace" font-size="15">assets/</text>
  <text x="109" y="286" fill="#53675c" font-family="ui-monospace, monospace" font-size="14">reading-flow.svg</text>
  <text x="109" y="314" fill="#53675c" font-family="ui-monospace, monospace" font-size="14">screen-home.webp</text>

  <path d="M334 228h105" fill="none" stroke="#43836b" stroke-width="4" marker-end="url(#arrow)" />
  <text x="337" y="207" fill="#53675c" font-family="system-ui, sans-serif" font-size="14">相对路径引用</text>

  <rect x="464" y="100" width="448" height="258" rx="18" fill="#fff" stroke="#c9d9ce" stroke-width="2" />
  <text x="490" y="139" fill="#23664e" font-family="system-ui, sans-serif" font-size="17" font-weight="700">文章正文</text>
  <rect x="490" y="158" width="396" height="174" rx="12" fill="#eaf2ec" />
  <rect x="512" y="178" width="352" height="134" rx="10" fill="#fff" stroke="#d3dfd6" />
  <path d="M540 277 594 222l39 39 31-30 72 68H540Z" fill="#9bc7a8" />
  <circle cx="765" cy="214" r="17" fill="#eac56d" />
  <text x="688" y="297" text-anchor="middle" fill="#53675c" font-family="system-ui, sans-serif" font-size="13">随阅读区域自适应</text>
  <text x="688" y="348" text-anchor="middle" fill="#53675c" font-family="system-ui, sans-serif" font-size="13">替代文字 + 图注，让图片更易理解</text>
</svg>
